summary: >-
  Ease is a platform in announced end-of-life. Employee Navigator, which acquired Ease in April
  2023, published a dated two-phase sunset on 2026-06-03: from 2027-01-01 no new companies can
  be added to Ease, and from 2027-07-01 Ease goes read-only and integrations plus customer
  support are discontinued. This is the single most important lifecycle fact about the provider
  and it applies to the whole platform, including the private EaseConnect / EaseConnect+
  integration surfaces, not just to an API version.
platform_sunset:
  announced: '2026-06-03'
  announcement_url: https://www.employeenavigator.com/ease-platform-sunset-announcement/
  announced_by: Employee Navigator (George Reese, CEO)
  phases:
  - date: '2027-01-01'
    name: No new companies
    effect: >-
      New companies can no longer be added to Ease and the "Add Company" feature is disabled.
      Existing companies are unaffected, including integrations, renewals and customer access.
  - date: '2027-07-01'
    name: Read-only sunset
    effect: >-
      Ease officially sunsets and transitions to read-only mode. Brokers, HR teams and employees
      retain access to historical data and reporting tools; integrations and customer support
      services for Ease are discontinued.
  migration:
    target: Employee Navigator
    tooling: >-
      A self-service migration tool moves companies from Ease to Employee Navigator; Employee
      Navigator states it is used hundreds of times a day and that 95% of Ease companies were
      eligible to upgrade without losing functionality as of the announcement.
    training: >-
      Weekly live virtual training through August 2026, in-person sessions, twice-monthly
      migration-tool training, and monthly HR training.
  integration_impact: >-
    EaseConnect (ANSI X12 EDI 834 carrier files), EaseConnect+ direct carrier connections, and
    the payroll/HRIS marketplace integrations are all in scope of the 2027-07-01 discontinuation.
