transports:
- protocol: REST
  documented: false
  note: No public REST API is documented. Private REST APIs exist inside EaseConnect+ carrier connections (EOI, Member Benefits) but are not published.
- protocol: EDI
  scheme: ANSI ASC X12 834
  documented: true
  public: false
  note: EaseConnect 834 enrollment and maintenance files, mapped per carrier inside the customer application.
- protocol: SFTP
  documented: true
  public: false
  note: Partner portal scheduled reports can be delivered over SFTP.
- protocol: WebSocket
  documented: false
- protocol: GraphQL
  documented: false
- protocol: gRPC
  documented: false
sources:
- url: https://www.ease.com/
  type: Website
  note: Company positioning; header banner "Ease is now owned by Employee Navigator!"; carrier preferred-partner list. No API mention.
- url: https://www.ease.com/partners/join-us/
  type: PartnerProgram
  note: 'Verbatim: "Gather the data you need ... with both manual and automatic data sync options via API (application programming interface) or EDI (electronic data interchange)." Partner portal export is by scheduled report or SFTP. Access is a contact form, not a signup.'
- url: https://www.ease.com/product/platform/marketplace/connections/
  type: Documentation
  note: EaseConnect+ described as a direct carrier connection set up by Ease analysts; no technical detail, no API reference, no ACORD.
- url: https://www.ease.com/product/platform/benefits-administration/managing-medical/834-files/
  type: Documentation
  note: Published 834 file carriers; confirms the ANSI X12 EDI 834 idiom (11 occurrences of "834 file" on the page).
- url: https://www.ease.com/marketplace/
  type: Marketplace
  note: Partner directory with categories including EaseConnect, EaseConnect+, Third Party EDI, Payroll Provider, Agency Management, CRM Integration.
- url: https://www.ease.com/blog/simple-setup-payroll-api-now-available/
  type: Blog
  note: Simple Setup Payroll connects Ease to ADP Workforce Now, ADP RUN, BambooHR, Paycor and Paylocity. Ease consumes those vendors' APIs; no Ease-published API, no docs, no keys.
- url: https://www.ease.com/blog/open-enrollment-made-easier-through-api-update-from-ease-and-principal/
  type: Blog
  note: Only place Ease names its own APIs - an "Evidence of Insurability (EOI) API" and a "Member Benefits API" inside the EaseConnect+ Principal connection. Neither is publicly documented or self-serve.
- url: https://www.ease.com/product/security/sso/
  type: Documentation
  note: SSO via Okta on the Enterprise package, mandatory two-factor authentication, HIPAA / SOC 2 Type II / HITRUST compliance claims.
- url: https://www.ease.com/blog/employee-navigator-announces-acquisition-of-ease/
  type: Blog
  note: Acquisition by Employee Navigator announced 2023-04-04.
actions:
  openapiDirectoryCreated: false
  apisYmlApisEmpty: true
  reason: |
    apis[] is intentionally empty. Ease publishes no public, documented, self-serve
    API and no machine-readable specification, so there is nothing real to list.
    Recording the absence accurately is the correct outcome for this record.
