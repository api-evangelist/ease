aid: ease
name: Ease
review:
  question: Does Ease expose a public, self-serve developer portal or any documented public API?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  sector: Insurance
  tier: benefits-admin
findings:
  summary: |
    Ease (Enrollease, Inc.) publishes no public developer portal, no public API
    reference, and no machine-readable API specification of any kind. Every
    developer-shaped hostname on the ease.com domain resolves through wildcard
    DNS to the Ease customer application sign-in page, and every developer-shaped
    path on the marketing site 404s. The company does integrate heavily - it is
    a benefits distribution hub - but every one of those integrations is
    partner-gated: negotiated one-to-one with a carrier, payroll vendor or
    general agency, delivered as an EDI 834 file or a private direct connection,
    and administered through a login-only partner portal. Ease is therefore an
    honest stub: real, substantial machine-to-machine plumbing with zero public
    API surface.
  developerPortal:
    exists: false
    url: ''
    confirmed: false
    note: |
      No first-party developer portal exists. Probes recorded 2026-07-25.
  acordPosture: no ACORD reference found; ANSI X12 EDI 834 idiom instead
  acordNote: |
    No occurrence of ACORD, AL3, ACORD XML, NGDS, IVANS, Applied Epic or
    Vertafore AMS360 was found on ease.com (homepage, /about/, /partners/,
    /partners/join-us/, /product/platform/marketplace/, .../marketplace/connections/,
    .../managing-medical/834-files/, /product/security/, /product/security/sso/,
    /marketplace/, /resources/faq/ all grepped). Ease sits in the group-employee-benefits
    lane, where the exchange standard is ANSI ASC X12 EDI 834 (benefit enrollment
    and maintenance), not the P&C ACORD/AL3/IVANS agency-download stack. The
    marketplace does carry an "Agency Management" partner category (e.g. AgencyBloc),
    but that is a listing of partner software, not an ACORD transport claim.
  insuranceVerbs:
    quote: false
    bind: false
    issue: partially - enrollment submission to carriers via EaseConnect 834 (EDI file) and EaseConnect+ (private direct connection); not a public API
    fnol: false
    note: |
      Ease is group-benefits enrollment administration, not a P&C quote/bind/issue/FNOL
      platform. The closest analogue to "issue" is transmitting enrollment and
      maintenance records to a carrier. Evidence of Insurability (EOI) is handled
      inside the EaseConnect+ direct connection with Principal, described in Ease
      marketing as an "Evidence of Insurability (EOI) API" and a "Member Benefits
      API", but neither is publicly documented, versioned, or self-serve. None of
      the four verbs is exposed to an unaffiliated developer.
  integrationSurfaces:
  - name: EaseConnect (834)
    mechanism: ANSI X12 EDI 834 enrollment files, self-service carrier file mapping inside the Ease application
    access: customer/broker login
    public: false
  - name: EaseConnect+
    mechanism: direct data connection between Ease and a carrier, set up by Ease implementation analysts with the broker
    access: negotiated per carrier; includes an EOI API and Member Benefits API in the Principal integration
    public: false
  - name: Marketplace payroll/HRIS integrations
    mechanism: API integrations built by Ease against partner platforms - ADP Workforce Now, ADP RUN, BambooHR, Paycor, Paylocity
    access: enabled per employer group inside the product
    public: false
    note: Ease is the API consumer here, not the API publisher.
  - name: Partner portal
    mechanism: scheduled reports downloadable from the portal or delivered over SFTP
    access: partner login
    public: false
  authModel:
    publicApiAuth: none documented
    applicationAuth: username/password with mandatory two-factor authentication; SAML single sign-on via Okta offered on the Enterprise package
    oidcDiscovery: 'not served - https://secure.ease.com/.well-known/openid-configuration returned 404 (HTML), https://secure.ease.com/.well-known/oauth-authorization-server returned 404 (HTML), https://www.ease.com/.well-known/openid-configuration returned 404'
    compliance: HIPAA, SOC 2 Type II, HITRUST claimed on https://www.ease.com/product/security/sso/
  specifications:
    openapiHarvested: false
    count: 0
    note: |
      No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, or .proto artifact was found or
      saved. The openapi/ directory is deliberately absent.
  webhooks:
    documented: false
    note: No public event catalog, webhook reference, or AsyncAPI document exists. Partner data egress is batch (scheduled report / SFTP), not event-driven.
  postman:
    public: false
    note: Postman public search for "ease benefits" returned zero workspaces, collections, or APIs (2026-07-25).
  graphql:
    documented: false
  grpc:
    documented: false
  sourceControl:
    githubOrganization: none found
    note: 'GitHub org probes all returned 404: github.com/ease, /easeinc, /enrollease, /ease-com, /easecentral.'
  corporate:
    legalEntity: Enrollease, Inc.
    headquarters: San Francisco, California, United States
    additionalOffices:
    - Las Vegas, Nevada
    - Omaha, Nebraska
    ownership: Acquired by Employee Navigator, announced 2023-04-04; both products continue to operate separately. Site header reads "Ease is now owned by Employee Navigator!"
    marketPosition: benefits administration and HR software for employers of 2-250 employees, distributed through insurance brokers; 75,000+ employer groups, 2.5M+ employees cited on ease.com/partners/join-us/
