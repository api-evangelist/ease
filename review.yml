transports:
- protocol: REST
  documented: false
  note: No public REST API is documented. Private REST APIs exist inside EaseConnect+ carrier connections (EOI, Member Benefits) but are not published.
- protocol: EDI
  scheme: ANSI ASC X12 834
  documented: true
  public: false
  note: EaseConnect 834 enrollment and maintenance files, mapped per carrier inside the customer application.
- protocol: SFTP
  documented: true
  public: false
  note: Partner portal scheduled reports can be delivered over SFTP.
- protocol: WebSocket
  documented: false
- protocol: GraphQL
  documented: false
- protocol: gRPC
  documented: false
sources:
- url: https://www.ease.com/
  type: Website
  note: Company positioning; header banner "Ease is now owned by Employee Navigator!"; carrier preferred-partner list. No API mention.
- url: https://www.ease.com/partners/join-us/
  type: PartnerProgram
  note: 'Verbatim: "Gather the data you need ... with both manual and automatic data sync options via API (application programming interface) or EDI (electronic data interchange)." Partner portal export is by scheduled report or SFTP. Access is a contact form, not a signup.'
- url: https://www.ease.com/product/platform/marketplace/connections/
  type: Documentation
  note: EaseConnect+ described as a direct carrier connection set up by Ease analysts; no technical detail, no API reference, no ACORD.
- url: https://www.ease.com/product/platform/benefits-administration/managing-medical/834-files/
  type: Documentation
  note: Published 834 file carriers; confirms the ANSI X12 EDI 834 idiom (11 occurrences of "834 file" on the page).
- url: https://www.ease.com/marketplace/
  type: Marketplace
  note: Partner directory with categories including EaseConnect, EaseConnect+, Third Party EDI, Payroll Provider, Agency Management, CRM Integration.
- url: https://www.ease.com/blog/simple-setup-payroll-api-now-available/
  type: Blog
  note: Simple Setup Payroll connects Ease to ADP Workforce Now, ADP RUN, BambooHR, Paycor and Paylocity. Ease consumes those vendors' APIs; no Ease-published API, no docs, no keys.
- url: https://www.ease.com/blog/open-enrollment-made-easier-through-api-update-from-ease-and-principal/
  type: Blog
  note: Only place Ease names its own APIs - an "Evidence of Insurability (EOI) API" and a "Member Benefits API" inside the EaseConnect+ Principal connection. Neither is publicly documented or self-serve.
- url: https://www.ease.com/product/security/sso/
  type: Documentation
  note: SSO via Okta on the Enterprise package, mandatory two-factor authentication, HIPAA / SOC 2 Type II / HITRUST compliance claims.
- url: https://www.ease.com/blog/employee-navigator-announces-acquisition-of-ease/
  type: Blog
  note: Acquisition by Employee Navigator announced 2023-04-04.
- url: https://www.ease.com/wp-json/
  type: OpenAPI
  note: |
    Found 2026-07-25. Live WordPress REST route discovery document, served anonymously,
    253 routes across 19 namespaces. The wp/v2 namespace exposes the Ease Marketplace
    (110 partners, 16 partner_types, 23 benefit_types), 33 events, 17 testimonials, posts,
    pages and media - all readable without credentials. Administrative routes return 401.
- url: https://status.ease.com/api
  type: APIReference
  note: |
    Found 2026-07-25. Ease's own endpoint reference for the Statuspage v2 API on
    status.ease.com - summary, status, components, incidents (unresolved and all) and
    scheduled maintenances (upcoming, active, all). All eight verified 200 anonymously.
- url: https://www.employeenavigator.com/ease-platform-sunset-announcement/
  type: Deprecation
  note: |
    Found 2026-07-25, published 2026-06-03. Dated two-phase sunset of the Ease platform:
    no new companies from 2027-01-01, read-only with integrations and support discontinued
    from 2027-07-01. Migration tooling and training to Employee Navigator described.
- url: https://www.employeenavigator.com/security/
  type: TrustCenter
  note: |
    Found 2026-07-25 via the link on https://www.ease.com/product/security/. Ease "now
    falls under Employee Navigator's security program", audited annually for SOC 2 Type II,
    HITRUST, NIST, GDPR, 23 NYCRR 500 and CCPA.
actions:
  openapiDirectoryCreated: true
  apisYmlApisEmpty: false
  revised: '2026-07-25'
  reason: |
    REVISED. The first pass left apis[] empty because Ease publishes no benefits API and
    no developer portal - both still true. The 2026-07-25 enrichment round then ran the
    full contract-discovery sweep against every host rather than only developer-shaped
    paths, and found two genuinely public, anonymous, machine-readable read surfaces:
    the www.ease.com WordPress REST API (which carries the Marketplace partner directory)
    and the status.ease.com Statuspage v2 API. Both are now listed in apis[] with specs in
    openapi/, live captures in examples/, and the usual conventions/errors/lifecycle/
    data-model/skills artifacts derived from them. Neither is presented as an Ease
    publication: the specs carry x-provenance blocks naming API Evangelist as the author
    and the live source they were derived from.
  notFound:
    packages: No first-party SDK on npm, PyPI or any registry; no GitHub organization.
    cli: None.
    components: None.
    sandbox: None - there is no test environment because there is no developer program.
    scopes: No OAuth anywhere, so no scope surface (scopes/ deliberately absent).
    grpc: None.
    changelog: No dated product changelog is published publicly; the status page incident history is not one.
    mcp: No MCP server. mcp/ease-mcp.yml holds a candidate tool list only and no MCPServer pointer is wired.
    vulnerabilityDisclosure: No security.txt, bug bounty or responsible-disclosure page for ease.com or employeenavigator.com.
