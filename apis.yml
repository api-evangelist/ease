  - type: Documentation
    url: https://www.ease.com/marketplace/
- name: Ease Status API
  description: >-
    The public, anonymous Atlassian Statuspage v2 API for the Ease platform, hosted at
    status.ease.com (page id 13zw4w6v89nk) and documented by Ease itself at
    https://status.ease.com/api. Eight GET endpoints return the platform status rollup, the
    three published components (Web Application, API, Support), open and historical incidents
    with their dated updates, and scheduled maintenance windows. Anyone can also subscribe an
    incident webhook, or the Atom/RSS feeds, without an account. This is the only first-party,
    self-serve, machine-readable operational API Ease publishes.
  humanURL: https://status.ease.com/
  baseURL: https://status.ease.com/api/v2
