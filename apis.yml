name: Ease
kind: company
description: >-
  Ease (legally Enrollease, Inc., San Francisco, with offices in Las Vegas and
  Omaha) is a United States benefits administration and HR platform sold through
  insurance brokers to small and mid-sized employers of roughly 2-250 employees.
  It covers online benefits enrollment, benefits and plan management, ACA
  reporting, onboarding and offboarding, and a partner marketplace spanning
  carriers, general agencies, third-party administrators, payroll providers and
  agency management systems. Ease is a group-benefits distribution platform
  rather than a risk carrier, so its lines of business are medical, dental,
  vision, life, AD&D, STD, LTD and voluntary/supplemental products written by its
  carrier partners. It was acquired by Employee Navigator in April 2023 and is
  now in announced end-of-life: Employee Navigator published a dated two-phase
  sunset on 2026-06-03 under which no new companies can be added to Ease from
  2027-01-01 and the platform goes read-only, with integrations and support
  discontinued, on 2027-07-01. Its benefits API posture is partner-gated and
  closed: Ease publishes no public developer portal and no API reference for the
  product. developer.ease.com, developers.ease.com, api.ease.com and
  docs.ease.com all resolve through wildcard DNS to the Ease application sign-in
  page, and ease.com/developers, /api, /developer and /integrations return 404.
  The real integration surface is EaseConnect (self-service mapping of ANSI X12
  EDI 834 enrollment files to carriers), EaseConnect+ (privately negotiated
  direct carrier data connections, which in the Principal integration include an
  Evidence of Insurability API and a Member Benefits API that Ease never
  documents publicly), marketplace API integrations with payroll and HRIS
  vendors such as ADP Workforce Now, ADP RUN, BambooHR, Paycor and Paylocity,
  and a partner portal whose data leaves by scheduled report or SFTP. Ease does
  however operate two real, anonymous, machine-readable read surfaces that this
  record captures: the WordPress REST API behind www.ease.com, which serves the
  full Ease Marketplace partner directory (110 partners, 16 partner types, 23
  benefit types) alongside blog, page, event and testimonial content; and the
  Atlassian Statuspage v2 API on status.ease.com, which serves platform status,
  component health, incident history and an anonymous incident-webhook
  subscription. No ACORD, AL3, NGDS or IVANS reference appears anywhere on the
  site - Ease operates in the group-benefits ANSI X12 834 idiom, not the P&C
  ACORD idiom.
