apis:
- name: Ease Content & Marketplace API
  description: >-
    The public, anonymous WordPress REST API behind www.ease.com. It is not the Ease benefits
    administration API, but it is a real machine-readable surface and it carries the Ease
    Marketplace: 110 published partner listings classified by 16 partner_types and 23
    benefit_types (a vocabulary that encodes the Ease integration idiom itself - EaseConnect,
    EaseConnect+, COBRA Integration, HSA HRA & FSA Integration). It also serves blog posts,
    marketing pages, media, 33 events and 17 customer testimonials. Every operation captured
    here was verified to return HTTP 200 anonymously on 2026-07-25; write and administrative
    routes exist on the host but return 401 and are deliberately excluded.
  humanURL: https://www.ease.com/marketplace/
  baseURL: https://www.ease.com/wp-json
  tags:
  - Marketplace
  - Content
  - Partners
  - Event
  tags_raw:
  - Marketplace
  - Content
  - Partners
  - Events
